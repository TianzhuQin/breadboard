@(title: String, message: String)
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@title</title>
    <link rel="shortcut icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/assets/css/participant.css?v=@models.AssetVersion.VALUE">
  </head>
  <body class="bb-page">
    <main class="bb-panel bb-panel--wide">
      @participantMark()
      <h1>@title</h1>
      <p>@message</p>
    </main>
  </body>
</html>

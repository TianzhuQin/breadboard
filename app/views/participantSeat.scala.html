@(clientId: String, continueUrl: String, otherUrl: String, texts: models.SystemTexts.Page)
<!DOCTYPE html>
<html lang="@texts.lang()">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@texts.t("seat.title")</title>
    <link rel="shortcut icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/assets/css/participant.css?v=@models.AssetVersion.VALUE">
  </head>
  <body class="bb-page">
    <main class="bb-panel">
      @participantMark()
      <h1>@texts.t("seat.title")</h1>
      <p class="bb-lead">@texts.before("seat.lead", "id")<strong>@clientId</strong>@texts.after("seat.lead", "id")</p>
      <a class="bb-button" href="@continueUrl">@texts.t("seat.continue", "id", clientId)</a>
      <p class="bb-alt"><a href="@otherUrl">@texts.t("seat.other")</a></p>
    </main>
  </body>
</html>

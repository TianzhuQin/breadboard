# Ebean's own settings (Play's are in application.conf), read from the classpath.

# One id at a time from each sequence, so that rows get ids in the order they are saved. Ebean takes
# 20 at a time by default, with "select s.nextval union select s.nextval ...", which H2 answers in
# the order of its hash (1..20, then 33..40, 21..32): rows saved one after the other got ids the wrong
# way round. Where events of the same millisecond are put in order by their id, they then came out
# in another order than they happened: in the data export, and in telling whether a Prolific
# participant was still there when their session finished. A fetch from a sequence costs next to
# nothing next to the row's own write.
ebean.databaseSequenceBatchSize=1

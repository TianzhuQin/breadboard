# Breadboard's settings for a release (breadboard.sh and breadboard.bat start the server with this
# file). Don't change them here: put the ones you change in conf/local.conf, one per line, as below
# (e.g.  breadboard.rootUrl="https://breadboard.example.org"). The launchers make that file, empty,
# at first start. It is read last, so its settings win, and releases never contain one: copy it into
# the next release when you upgrade. Any setting can also be given when starting, e.g.
#   ./breadboard.sh -Dhttp.port=8080

application.version="v3.1.0"
application.mode=PROD

# ---- The server --------------------------------------------------------------------------------

# Its port (9000), and how much memory it may use for its data (Java's heap: 1g). The launchers
# read these two from conf/local.conf (not from this file) and pass them on to Java, e.g.
#   http.port=8080
#   breadboard.memory=2g

# ---- Where participants reach this server ------------------------------------------------------

# The public address of this server, e.g. "https://breadboard.example.org": Mechanical Turk HITs
# send workers to it. (The participant links the console shows use the address the console was
# opened at, so open it at the public address before copying them.)
breadboard.rootUrl="http://localhost:9000"
# "auto": pages connect their websocket back to the address and scheme they were loaded from, which
# also works behind an HTTPS reverse proxy.
breadboard.wsUrl="auto"
# When everyone reaches the server over HTTPS (e.g. through a reverse proxy), make the participants'
# seat cookies and the researchers' sign-in cookie HTTPS-only:
breadboard.secureCookies=false
#session.secure=true

# HTTPS directly from Breadboard (a reverse proxy such as Caddy or nginx is usually simpler):
#   ./breadboard.sh -Dhttps.port=9443 -Dhttps.keyStore=/path/to/keystore.jks -Dhttps.keyStorePassword=...

# ---- Running sessions --------------------------------------------------------------------------

# How often, in milliseconds, participants' pages are updated (0: on every change, as in v2.2).
breadboard.clientUpdateRate=500

# Whether people may join a session after its game started (off: they are told it has started).
breadboard.allowLateJoin=false

# Run an experiment without anyone at the console (the console's Autopilot page is the easier way;
# these settings apply only while that page has nothing saved):
#breadboard.autopilot.experiment="My experiment"
#breadboard.autopilot.user="researcher@example.org"
#breadboard.autopilot.continuous=true
#breadboard.autopilot.nextSessionDelaySeconds=10
# The longest a session's game may run, in minutes, before the autopilot ends it (0 or left out: no limit):
#breadboard.autopilot.maxSessionMinutes=120

# Height in pixels of the Mechanical Turk frame.
breadboard.amtFrameHeight=800

# Experimental, opt-in Groovy features (see ScriptLoader.EXPERIMENTAL_SCRIPTS).
breadboard.experimental=false

# ---- Mechanical Turk ---------------------------------------------------------------------------

# Your AWS keys, from the environment (AMT_ACCESS_KEY, AMT_SECRET_KEY) or written here.
amt.secretKey=${?AMT_SECRET_KEY}
amt.accessKey=${?AMT_ACCESS_KEY}

# ---- Secret key --------------------------------------------------------------------------------

# Signs researchers' sign-ins and participants' invitation links. The launchers generate one on
# first start (conf/application.secret) unless APPLICATION_SECRET is set. Keep it private, and the
# same across restarts and on every server that shares this database.
application.secret="changeme"
application.secret=${?APPLICATION_SECRET}


######## You shouldn't have to change anything below this line ########
#######################################################################

application.langs="en"
application.global=Global

# The database: an H2 file in db/. Back it up by copying db/ while the server is stopped.
# DB_CLOSE_ON_EXIT=FALSE: H2 would otherwise close it as soon as the server is asked to stop, while
# the stop still records that a running session ended with it. The server closes it itself at the
# end of the stop, after its connection pool, whatever connections are still open
# (CloseDatabasePlugin), or when a stuck script holds the stop up and it is cut short
# (Global.stopIfShutdownHangs). TRACE_LEVEL_FILE=0: H2 keeps no db/breadboard.trace.db of its own
# (every new install had one, holding the "not found" of a look for Play's evolutions table, which a
# new database doesn't have yet); errors that matter reach the server's log.
db.default.driver=org.h2.Driver
db.default.url="jdbc:h2:db/breadboard;MODE=MYSQL;DB_CLOSE_ON_EXIT=FALSE;TRACE_LEVEL_FILE=0"

# Evolutions stay off, so a database copied over from an older release is never rewritten by Play.
# A new, empty database gets its tables from the same scripts at first start (Global.java), and
# older databases are brought up to date by Breadboard itself.
evolutionplugin=disabled

ebean.default="models.*"

# Logging (logs/application.log) is set in conf/logger.xml: Play reads the levels from there, not
# from logger.* keys in this file.

# Akka, which runs the experiments' scripts, logs through the same logger, so that its errors (such
# as a fatal error that stops the server) reach logs/application.log, not only the console.
akka.loggers = ["akka.event.slf4j.Slf4jLogger"]
akka.loglevel = "WARNING"

# Browser caching of the front-end bundles. The entry bundles and stylesheets keep fixed names, so
# browsers must check them on every load (they still get a quick 304 when nothing changed);
# otherwise participants could run an old client for up to an hour after an update. The chunks they
# load on demand have content hashes in their names and keep the default caching.
"assets.cache./public/bundles/client.js"="no-cache"
"assets.cache./public/bundles/client.css"="no-cache"
"assets.cache./public/bundles/breadboard.js"="no-cache"
"assets.cache./public/bundles/design.js"="no-cache"
"assets.cache./public/bundles/design.css"="no-cache"
"assets.cache./public/bundles/client-angular.js"="no-cache"
"assets.cache./public/bundles/client-angular.css"="no-cache"
"assets.cache./public/css/participant.css"="no-cache"
"assets.cache./public/admin/admin.js"="no-cache"
"assets.cache./public/admin/admin.css"="no-cache"

# The settings you change (see the top), when there is a conf/local.conf: last, so that they win.
include "local.conf"

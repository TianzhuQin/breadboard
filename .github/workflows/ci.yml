# Every push to main and every pull request: build the front end and run its unit tests, run the
# server's tests, then package a release and start it on an empty database (bin/smoke-dist). The
# releases that carry their own Java (bin/bundle-java) are started the same way on Linux, macOS and
# Windows (bin/smoke-dist.ps1). The zips are kept as a build artifact for a week.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build:all
      - name: Type check the console
        run: pnpm --filter ./admin run typecheck
      - name: Unit tests
        run: pnpm run test:all
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: |
            public/admin
            public/bundles
          retention-days: 3

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            .sbt-launcher
          key: sbt-${{ hashFiles('project/Build.scala', 'project/plugins.sbt', 'project/build.properties', 'project/sbt-repositories') }}
          restore-keys: sbt-
      - name: Tests
        run: JAVA8_HOME="$JAVA_HOME" bin/sbt8 test

  release:
    name: Release package
    needs: [frontend, server]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            .sbt-launcher
          key: sbt-${{ hashFiles('project/Build.scala', 'project/plugins.sbt', 'project/build.properties', 'project/sbt-repositories') }}
          restore-keys: sbt-
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public
      - name: Package
        run: SKIP_FRONTEND=1 JAVA8_HOME="$JAVA_HOME" bin/make-dist
      - name: Start it on an empty database
        run: JAVA8_HOME="$JAVA_HOME" bin/smoke-dist "target/release/breadboard-$(sed -n 's/.*appVersion *= *"\(.*\)".*/\1/p' project/Build.scala).zip"
      - name: Add Java for each platform
        run: bin/bundle-java
      - name: Start the Linux one on its own Java
        run: bin/smoke-dist target/release/breadboard-*-linux-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: breadboard-release
          path: |
            target/release/breadboard-*.zip
            target/release/breadboard-*.zip.sha256
          retention-days: 7

  macos:
    name: macOS package
    needs: release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: breadboard-release
          path: target/release
      - name: Start it on its own Java
        run: bin/smoke-dist target/release/breadboard-*-macos-arm64.zip

  windows:
    name: Windows package
    needs: release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: breadboard-release
          path: target/release
      - name: Start it with breadboard.bat on its own Java
        shell: pwsh
        run: |
          $zip = Get-ChildItem target/release/breadboard-*-windows-x64.zip | Select-Object -First 1
          ./bin/smoke-dist.ps1 -Zip $zip.FullName
